<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CORE NODE · ACCESS</title>
    <style>
        :root {
            color: #161618;
            background: #f7f7f5;
            font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 15% 12%, rgba(99, 102, 241, .13), transparent 28rem),
                radial-gradient(circle at 86% 88%, rgba(17, 17, 17, .08), transparent 24rem),
                #f7f7f5;
        }

        main {
            width: min(100%, 424px);
            padding: 40px;
            background: rgba(255, 255, 255, .92);
            border: 1px solid rgba(17, 17, 17, .10);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(17, 17, 17, .13);
        }

        .brand {
            margin: 0 0 28px;
            font-size: .78rem;
            font-weight: 800;
            letter-spacing: .16em;
        }

        h1 { margin: 0; font-size: clamp(1.75rem, 7vw, 2.35rem); letter-spacing: -.06em; }
        .accent { width: 34px; height: 4px; margin: 16px 0 28px; border-radius: 999px; background: #4f46e5; }
        .intro { margin: 0 0 28px; color: #5f5f58; line-height: 1.6; }

        form { display: grid; gap: 18px; }
        label { display: grid; gap: 8px; font-size: .9rem; font-weight: 700; }

        input:not([type="hidden"]) {
            width: 100%;
            min-height: 48px;
            padding: 0 14px;
            border: 1px solid #d6d6d1;
            border-radius: 12px;
            color: inherit;
            background: #fff;
            font: inherit;
        }

        input:focus { outline: 3px solid rgba(79, 70, 229, .24); border-color: #4f46e5; }

        button {
            min-height: 48px;
            border: 0;
            border-radius: 12px;
            color: #fff;
            background: #4f46e5;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover { background: #4338ca; }
        .error { margin: 0; padding: 11px 12px; border-radius: 12px; color: #991b1b; background: #fef2f2; line-height: 1.5; }

        @media (max-width: 480px) {
            body { padding: 16px; }
            main { padding: 30px 24px; border-radius: 20px; }
        }
    </style>
</head>
<body>
<main aria-labelledby="login-title">
    <p class="brand">CORE NODE</p>
    <h1 id="login-title">ACCESS</h1>
    <div class="accent" aria-hidden="true"></div>
    <p class="intro">登录以继续 CORE AGENT 授权。</p>
    <p class="error" role="alert" th:if="${oauthLoginError != null}" th:text="${oauthLoginError}">登录失败，请检查账号或密码后重试。</p>
    <form method="post" action="/oauth/login" th:action="@{/oauth/login}">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="username">
            用户名
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </label>
        <label for="password">
            密码
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">继续授权</button>
    </form>
</main>
</body>
</html>
