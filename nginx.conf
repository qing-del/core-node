# ============================================================
# ServerA — Nginx 前端 + 反向代理
#
# 端口策略:
#   - 所有 API 请求统一走此 Nginx 反代，后端不暴露宿主机端口
#   - 回调接口 /common/** 同样通过此 Nginx 代理（凭 X-Callback-Token 鉴权）
#   - 前端 SPA 入口为挂载的 /usr/share/nginx/html
#
# 挂载到容器 /etc/nginx/conf.d/default.conf
# ============================================================

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name localhost;

    # ---------- 请求体大小限制 ----------
    client_max_body_size 5m;

    # ---------- 前端 SPA ----------
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长期缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 文档分享短链跳转 ----------
    # /s/{code} 必须到达后端控制器，由后端返回 302 到 /share/documents/{code}。
    # ^~ 保证该凭证路径不会被下面的 SPA fallback 抢先接管；/share/ 仍走 location /。
    location ^~ /s/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_intercept_errors off;
        # The code is an opaque credential; do not write it to Nginx access logs.
        access_log off;
    }

    # 兑换接口的 code 同样位于 URL path；关闭该窄路径的访问日志，避免凭证进入 Nginx 日志。
    # 其 rewrite、代理目标和请求头与下面的通用 /api/ 配置保持一致。
    location ^~ /api/user/document/share-links/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---------- 后端 API ----------
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

